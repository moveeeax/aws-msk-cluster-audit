[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-msk-cluster-audit"
version = "0.1.0"
description = "Audit Amazon MSK clusters offline from describe-cluster-v2 / list-clusters-v2 JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "msk", "kafka", "audit", "security", "sre", "devops", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/moveeeax/aws-msk-cluster-audit"
Issues = "https://github.com/moveeeax/aws-msk-cluster-audit/issues"

[project.scripts]
aws-msk-cluster-audit = "aws_msk_cluster_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["aws_msk_cluster_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

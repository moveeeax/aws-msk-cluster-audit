name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q

      - name: Smoke — findings exit 1
        run: |
          set +e
          aws-msk-cluster-audit --input examples/dump --min-version 3.6.0
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: Smoke — a hardened cluster exits 0
        run: |
          aws-msk-cluster-audit --input tests/fixtures/hardened.json --min-version 3.6.0

      - name: Smoke — non-MSK input exits 2
        run: |
          set +e
          aws-msk-cluster-audit --input tests/fixtures/not_msk.json
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Smoke — stdin and JSON output
        run: |
          cat examples/dump/eu-west-1-clusters.json \
            | aws-msk-cluster-audit --format json --fail-on none \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['summary']['clusters_audited']==4, d['summary']"
